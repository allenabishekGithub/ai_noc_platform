apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: tfs-agentic
spec:
  ports:
    - port: 11434
      targetPort: 11435
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
subsets:
  - addresses:
      - ip: ${OLLAMA_HOST_IP}
    ports:
      - port: 11435
