apiVersion: apps/v1
kind: Deployment
metadata:
  name: tfs-mcp-server
  labels:
    app.kubernetes.io/name: tfs-mcp-server
    app.kubernetes.io/part-of: tfs-agentic
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tfs-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tfs-mcp-server
        app.kubernetes.io/part-of: tfs-agentic
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: tfs-mcp-server
          image: tfs-agentic-tfs-mcp-server:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tfs-agentic-config
            - secretRef:
                name: tfs-agentic-secret
          ports:
            - containerPort: 3002
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
