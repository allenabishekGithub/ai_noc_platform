{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tfs-agentic.secretName" . }}
  labels:
    {{- include "tfs-agentic.labels" . | nindent 4 }}
type: Opaque
stringData:
  TFS_NBI_USER: {{ .Values.secrets.tfsNbiUser | quote }}
  TFS_NBI_PASS: {{ .Values.secrets.tfsNbiPass | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENWEBUI_EMAIL: {{ .Values.secrets.openwebuiEmail | quote }}
  OPENWEBUI_PASSWORD: {{ .Values.secrets.openwebuiPassword | quote }}
{{- end }}
