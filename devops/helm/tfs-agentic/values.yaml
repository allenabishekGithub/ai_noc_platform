# Default values for the TFS Agentic Module chart. Keep credentials in an
# untracked values file or reference a pre-existing Kubernetes Secret.
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

agent:
  replicaCount: 1
  image:
    repository: tfs-agentic-agentic-module
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8800
  ingress:
    enabled: true
    className: public
    annotations:
      nginx.ingress.kubernetes.io/limit-connections: "50"
      nginx.ingress.kubernetes.io/limit-rps: "50"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/use-regex: "true"
    path: /agentic(/|$)(.*)
    pathType: ImplementationSpecific
    hosts: []
    tls: []
  resources: {}
  podAnnotations: {}

mcp:
  replicaCount: 1
  image:
    repository: tfs-agentic-tfs-mcp-server
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3002
  resources: {}
  podAnnotations: {}

persistence:
  faiss:
    enabled: true
    # Use a PVC created outside this release when it must survive a Helm
    # uninstall. When set, the chart does not create a PVC.
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi

# The normal deployment points OLLAMA_BASE_URL to an externally reachable
# Ollama service. Enable this only for the legacy host-network proxy pattern.
ollama:
  proxy:
    enabled: false
    hostIP: ""
    targetHost: ""
    targetPort: 11434
    listenPort: 11435
    image: alpine/socat:latest

config:
  agentApiHost: 0.0.0.0
  agentApiPort: "8800"
  faissIndexPath: /app/faiss_index
  llmProvider: ollama
  llmModel: qwen2.5:7b-instruct
  ollamaBaseUrl: http://ollama.example.invalid:11434
  ollamaNumCtx: "8192"
  llmTemperature: "0.2"
  embeddingModel: sentence-transformers/all-MiniLM-L6-v2
  agentVerbose: "false"
  agentMaxIterations: "15"
  agentExposeRawMcpTools: "false"
  mcpHardResponseCap: "20000"
  a2aPeers: ""
  defaultContextUuid: admin
  defaultTopologyUuid: admin
  controllerCacheTtlSeconds: "120"
  tfsNbiUrl: http://tfs-controller.example.invalid
  tfsNbiPrefix: /tfs-api
  tfsMcpPort: "3002"
  # Empty uses the in-release MCP service.
  mcpServers: ""
  openaiBaseUrl: ""
  openwebuiBaseUrl: ""
  agentPublicUrl: ""

observability:
  # Empty disables OTLP traces while Prometheus /metrics remains available.
  otlpEndpoint: ""

secrets:
  # Set this to use a Secret created by External Secrets, SOPS, or an operator.
  # It must contain the six keys generated by templates/secret.yaml.
  existingSecret: ""
  tfsNbiUser: ""
  tfsNbiPass: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  openwebuiEmail: ""
  openwebuiPassword: ""
