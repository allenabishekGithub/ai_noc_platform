apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: tfs-agentic-observability
configMapGenerator:
  - name: tfs-agentic-grafana-dashboards
    files:
      - tfs-agentic-overview.json
      - cross-domain-workflow.json
      - mcp-server.json
      - gateway.json
