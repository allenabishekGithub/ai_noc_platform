apiVersion: v1
kind: ConfigMap
metadata:
  name: tfs-agentic-grafana-datasources
  namespace: observability
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/part-of: tfs-agentic-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
        editable: false
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        editable: false
